name: Apply portfolio enhancements

on:
  push:
    branches:
      - enhance-card-interactions

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_live = ".live-stack{display:grid;gap:22px}.live-card{background:var(--card);border:1px solid var(--paper-line);border-radius:4px;padding:36px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.live-card:hover,.live-card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px -12px rgba(22,35,59,.22);border-color:var(--blueprint-dim)}"
          new_live = ".live-stack{display:grid;gap:22px}.live-card{background:var(--card);border:1px solid var(--paper-line);border-radius:4px;padding:36px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;text-decoration:none;color:inherit;cursor:pointer;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.22,1,.36,1),box-shadow .42s ease,border-color .3s ease}.live-card:hover,.live-card:focus-visible{transform:translate3d(-4px,-7px,0) rotateZ(-1deg) rotateX(.5deg) scale(1.005);box-shadow:0 22px 42px -18px rgba(22,35,59,.28);border-color:var(--blueprint-dim)}"
          if old_live not in s:
              raise SystemExit('live-card CSS target not found')
          s = s.replace(old_live, new_live, 1)

          old_card = ".grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card{background:var(--card);border:1px solid var(--paper-line);border-radius:4px;padding:26px;display:flex;flex-direction:column;gap:12px}.card-top"
          new_card = ".grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;position:relative;z-index:1}.card{background:var(--card);border:1px solid var(--paper-line);border-radius:4px;padding:26px;display:flex;flex-direction:column;gap:12px;position:relative;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.22,1,.36,1),box-shadow .42s ease,border-color .3s ease}.card:hover,.card:focus-within{transform:translate3d(-6px,-8px,0) rotateZ(-1.5deg) scale(1.01);box-shadow:0 24px 46px -20px rgba(22,35,59,.3);border-color:var(--blueprint-dim);z-index:3}.card-top"
          if old_card not in s:
              raise SystemExit('card CSS target not found')
          s = s.replace(old_card, new_card, 1)

          old_vox = "<ul><li>Desktop local voice recording</li><li>Mobile meeting recording mode</li><li>Gemini-powered transcription and AI summaries</li><li>PDF, Markdown, and note export workflow</li></ul>"
          new_vox = "<ul><li>React + Tailwind front end</li><li>Node.js backend + API services</li><li>Gemini-powered transcription and AI summaries</li><li>PDF, Markdown, and note export workflow</li></ul>"
          if old_vox not in s:
              raise SystemExit('VoxNote spec target not found')
          s = s.replace(old_vox, new_vox, 1)

          marker = "</style>"
          bg_css = r'''
  .dev-field{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.7}
  .dev-field::before{content:"";position:absolute;inset:0;background:radial-gradient(circle 280px at var(--mx,50%) var(--my,30%),rgba(44,95,138,.09),transparent 70%);transition:background .15s ease}
  .dev-snippet{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--blueprint);opacity:0;transform:translate3d(0,6px,0) scale(.96);transition:opacity .45s ease,transform .65s cubic-bezier(.22,1,.36,1);white-space:nowrap}
  .dev-snippet.visible{opacity:.26;transform:translate3d(0,0,0) scale(1)}
  .dev-snippet::before{content:"";display:inline-block;width:4px;height:4px;margin-right:6px;border:1px solid currentColor;border-radius:50%;vertical-align:1px;opacity:.7}
  body{position:relative}
  main,.site,footer{position:relative;z-index:1}
  @media (max-width:820px){.dev-field{display:none}}
  @media (prefers-reduced-motion:reduce){.dev-field{display:none}}
'''
          if bg_css.strip() not in s:
              s = s.replace(marker, bg_css + "\n" + marker, 1)

          body_marker = '<body>'
          field_html = '''<body>\n<div class="dev-field" aria-hidden="true">\n  <span class="dev-snippet" data-code="const build = async () => {}">const build = async () =&gt; {}</span>\n  <span class="dev-snippet" data-code="React + TypeScript">React + TypeScript</span>\n  <span class="dev-snippet" data-code="npm run build">npm run build</span>\n  <span class="dev-snippet" data-code="git commit -m \"ship it\"">git commit -m "ship it"</span>\n  <span class="dev-snippet" data-code="POST /api/transcribe">POST /api/transcribe</span>\n  <span class="dev-snippet" data-code="Node.js // API">Node.js // API</span>\n  <span class="dev-snippet" data-code="{ ... }">{ ... }</span>\n  <span class="dev-snippet" data-code="&lt;/&gt;">&lt;/&gt;</span>\n  <span class="dev-snippet" data-code="await prisma.user.findMany()">await prisma.user.findMany()</span>\n  <span class="dev-snippet" data-code="Next.js / Server">Next.js / Server</span>\n  <span class="dev-snippet" data-code="200 OK // deployed">200 OK // deployed</span>\n  <span class="dev-snippet" data-code="const api = fetch(...)">const api = fetch(...)</span>\n</div>'''
          if '<div class="dev-field"' not in s:
              if body_marker not in s:
                  raise SystemExit('body marker not found')
              s = s.replace(body_marker, field_html, 1)

          script_marker = '</body>'
          script = r'''
<script>
(() => {
  const field = document.querySelector('.dev-field');
  const snippets = [...document.querySelectorAll('.dev-snippet')];
  if (!field || !snippets.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const positions = [
    [7,20],[82,18],[14,43],[76,39],[4,72],[86,70],[26,86],[68,88],[45,12],[52,74],[93,48],[35,54]
  ];
  snippets.forEach((el,i) => {
    el.style.left = positions[i][0] + '%';
    el.style.top = positions[i][1] + '%';
  });
  let lastX = -9999, lastY = -9999, raf = 0;
  const update = (x,y) => {
    field.style.setProperty('--mx', `${x}px`);
    field.style.setProperty('--my', `${y}px`);
    snippets.forEach((el,i) => {
      const rect = el.getBoundingClientRect();
      const dx = x - (rect.left + rect.width/2);
      const dy = y - (rect.top + rect.height/2);
      const distance = Math.hypot(dx,dy);
      el.classList.toggle('visible', distance < 250);
    });
  };
  window.addEventListener('mousemove', e => {
    lastX=e.clientX; lastY=e.clientY;
    if (!raf) raf=requestAnimationFrame(()=>{update(lastX,lastY);raf=0;});
  }, {passive:true});
  window.addEventListener('mouseleave', () => snippets.forEach(el=>el.classList.remove('visible')));
})();
</script>
'''
          if script.strip() not in s:
              s = s.replace(script_marker, script + script_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enhance portfolio card interactions and dev background" || exit 0
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-portfolio-enhancements.yml
          git commit -m "Remove temporary enhancement workflow"
          git push
