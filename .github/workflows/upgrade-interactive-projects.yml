name: Add interactive project cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add interactive cards and case-study modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css = r'''
          /* Interactive project cards */
          .card,.live-card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;overflow:hidden}
          .card::after,.live-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 180px at var(--mx) var(--my),rgba(44,95,138,.075),transparent 68%);opacity:0;transition:opacity .3s ease;z-index:0}
          .card:hover::after,.live-card:hover::after,.card.pointer-active::after,.live-card.pointer-active::after{opacity:1}
          .card > *,.live-card > *{position:relative;z-index:1}
          .card.pointer-active{transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translate3d(-6px,-8px,0) rotateZ(-1.5deg) scale(1.012)}
          .live-card.pointer-active{transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translate3d(-4px,-7px,0) rotateZ(-1deg) scale(1.006)}
          .case-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(22,35,59,.34);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s ease}
          .case-modal.open{opacity:1;pointer-events:auto}
          .case-dialog{width:min(720px,100%);max-height:min(82vh,760px);overflow:auto;background:var(--card);border:1px solid var(--paper-line);box-shadow:0 30px 80px -28px rgba(22,35,59,.45);border-radius:4px;padding:30px;transform:translateY(14px) scale(.985);transition:transform .3s cubic-bezier(.22,1,.36,1)}
          .case-modal.open .case-dialog{transform:none}
          .case-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blueprint);margin-bottom:8px}
          .case-dialog h3{font-size:28px;margin:0 44px 10px 0}.case-dialog p{color:var(--ink-soft);font-size:15px}.case-meta{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.case-meta span{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--paper-line);padding:4px 8px;color:var(--ink-soft)}
          .case-close{position:absolute;right:18px;top:16px;border:1px solid var(--paper-line);background:var(--paper);color:var(--ink);width:34px;height:34px;border-radius:2px;font-size:20px;cursor:pointer}.case-close:hover{border-color:var(--blueprint);color:var(--blueprint)}
          .case-dialog{position:relative}.case-sections{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.case-block{border-left:2px solid var(--blueprint-dim);padding-left:14px}.case-block strong{font-family:'Space Grotesk',sans-serif;font-size:14px}.case-block div{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
          .case-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.case-actions a{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--ink);padding:10px 16px}.case-actions a.primary{background:var(--ink);color:var(--paper)}.case-actions a.primary:hover{background:var(--blueprint);border-color:var(--blueprint);color:#fff}
          @media (max-width:600px){.case-sections{grid-template-columns:1fr}.case-dialog{padding:24px}.case-dialog h3{font-size:24px}}
          @media (prefers-reduced-motion:reduce){.card.pointer-active,.live-card.pointer-active{transform:translate3d(-6px,-8px,0) rotateZ(-1.5deg) scale(1.01)}}
          '''
          js = r'''
          <script>
          (() => {
            const cards = document.querySelectorAll('.card, .live-card');
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!reduce) {
              cards.forEach(card => {
                card.addEventListener('pointermove', e => {
                  const r = card.getBoundingClientRect();
                  const x = (e.clientX - r.left) / r.width;
                  const y = (e.clientY - r.top) / r.height;
                  const tiltX = (0.5 - y) * 3.2;
                  const tiltY = (x - 0.5) * 3.2;
                  card.style.setProperty('--rx', `${tiltX.toFixed(2)}deg`);
                  card.style.setProperty('--ry', `${tiltY.toFixed(2)}deg`);
                  card.style.setProperty('--mx', `${(x * 100).toFixed(1)}%`);
                  card.style.setProperty('--my', `${(y * 100).toFixed(1)}%`);
                  card.classList.add('pointer-active');
                });
                card.addEventListener('pointerleave', () => {
                  card.classList.remove('pointer-active');
                  card.style.setProperty('--rx','0deg'); card.style.setProperty('--ry','0deg');
                  card.style.setProperty('--mx','50%'); card.style.setProperty('--my','50%');
                });
              });
            }

            const projectCards = document.querySelectorAll('#builds .card');
            if (!projectCards.length) return;
            const modal = document.createElement('div');
            modal.className = 'case-modal';
            modal.setAttribute('aria-hidden','true');
            modal.innerHTML = `<div class="case-dialog" role="dialog" aria-modal="true" aria-labelledby="case-title"><button class="case-close" type="button" aria-label="Close case study">×</button><div class="case-kicker">Project case study</div><h3 id="case-title"></h3><p id="case-summary"></p><div class="case-meta" id="case-meta"></div><div class="case-sections"><div class="case-block"><strong>What it solves</strong><div id="case-problem"></div></div><div class="case-block"><strong>Build focus</strong><div id="case-focus"></div></div><div class="case-block"><strong>Technology</strong><div id="case-tech"></div></div><div class="case-block"><strong>Build status</strong><div id="case-status"></div></div></div><div class="case-actions" id="case-actions"></div></div>`;
            document.body.appendChild(modal);
            const close = () => { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); document.body.style.overflow=''; };
            modal.querySelector('.case-close').addEventListener('click', close);
            modal.addEventListener('click', e => { if (e.target === modal) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

            projectCards.forEach(card => {
              card.style.cursor = 'pointer';
              card.setAttribute('tabindex','0');
              card.setAttribute('role','button');
              const open = () => {
                const title = card.querySelector('h3')?.textContent.trim() || 'Project';
                const summary = card.querySelector('p')?.textContent.trim() || 'A production-focused build from Dreamline Labs.';
                const tags = [...card.querySelectorAll('.tech-tags span')].map(x => x.textContent.trim()).filter(Boolean);
                const stamp = card.querySelector('.stamp')?.textContent.trim() || 'Build';
                const note = card.querySelector('.note')?.textContent.trim() || 'Production-focused product build.';
                const href = card.querySelector('a')?.href || '';
                modal.querySelector('#case-title').textContent = title;
                modal.querySelector('#case-summary').textContent = summary;
                modal.querySelector('#case-meta').innerHTML = tags.map(t => `<span>${t}</span>`).join('');
                modal.querySelector('#case-problem').textContent = `Designed to turn a real workflow or business need into a usable product rather than a static demo.`;
                modal.querySelector('#case-focus').textContent = note;
                modal.querySelector('#case-tech').textContent = tags.length ? tags.join(' · ') : 'Full-stack product architecture';
                modal.querySelector('#case-status').textContent = stamp;
                const actions = modal.querySelector('#case-actions');
                actions.innerHTML = href ? `<a class="primary" href="${href}" target="_blank" rel="noopener noreferrer">View project ↗</a>` : '';
                modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; modal.querySelector('.case-close').focus();
              };
              card.addEventListener('click', e => { if (e.target.closest('a')) return; open(); });
              card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === card) { e.preventDefault(); open(); } });
            });
          })();
          </script>
          '''
          marker = '</style>'
          if '/* Interactive project cards */' not in s:
            s = s.replace(marker, css + '\n</style>', 1)
          if 'Project case study' not in s:
            s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s)
          PY
      - name: Remove this workflow after upgrade
        run: |
          rm -f .github/workflows/upgrade-interactive-projects.yml
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/upgrade-interactive-projects.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add interactive project cards and case studies'
          git push
